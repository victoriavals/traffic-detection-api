[project]
name = "traffic-detection-api"
version = "0.2.0"
description = "FastAPI backend for Traffic Pulse — vehicle detection (YOLOv11 + ByteTrack + supervision)"
requires-python = ">=3.11"
dependencies = [
    # ─── Web framework ───
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "websockets>=14.0",

    # ─── AI / Computer Vision ───
    # torch + torchvision are pulled from the PyTorch CUDA index (see
    # [tool.uv.sources] below). PyPI default is CPU-only on Windows which
    # breaks GPU inference (torchvision::nms with CUDA tensors).
    "torch~=2.11.0",
    "torchvision~=0.26.0",
    "ultralytics>=8.3.0",
    "supervision>=0.25.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",

    # ─── HTTP client (EZVIZ Cloud API, video URL download) ───
    "httpx>=0.27.0",

    # ─── Environment & config ───
    "python-dotenv>=1.0.0",

    # ─── Database (activity logs & stats) ───
    "motor>=3.6.0",

    # ─── Authentication (JWT + password hashing) ───
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.1,<6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

# ─── uv configuration ────────────────────────────────────────────────────────
# Force torch + torchvision to come from PyTorch's CUDA 12.8 wheel index.
# Without this, `uv sync` resolves them from PyPI which serves CPU-only
# wheels on Windows → torchvision::nms fails on CUDA tensors at runtime.
#
# `explicit = true` means this index is ONLY used for packages that name it
# in [tool.uv.sources]. All other packages still come from PyPI.
#
# CUDA version note: change cu128 → cu121 / cu118 to match your NVIDIA driver.
# CPU-only deploy: replace with `https://download.pytorch.org/whl/cpu`.

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# System dependencies (NOT pip-installable — install via OS package manager):
# - ffmpeg          required for video re-encoding
#   Linux : apt install ffmpeg
#   Windows: winget install ffmpeg   (or  choco install ffmpeg)
# - NVIDIA driver + CUDA 12.8 runtime (for GPU inference; CPU fallback works)
